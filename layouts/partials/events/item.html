{{- /* An event as a card in the list: the .item base does the layout, .event
       only tunes it, through the tokens of assets/tokens/components. */ -}}
<article class="item event" {{- partial "func/SetAnim.html" (dict "element" "item") }}>
  {{ partial "events/item/content.html" . }}
  {{ partial "events/item/metas.html" . }}
  {{ partial "events/item/media.html" . }}
</article>
